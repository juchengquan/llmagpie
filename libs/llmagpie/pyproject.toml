[build-system]
requires = [
    "setuptools>=59.8.0",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "llmagpie"
version = "0.0.1"
requires-python = ">=3.10"
authors = [
    {name = "cqju"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# dynamic = ["dependencies"]
dependencies = [
    "numpy>=1.26.0",
    "networkx==3.2.1",
    "deprecated==1.2.14",
    "chromadb==0.4.24",
    "pydantic>=2.6.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
all = [
    "sqlalchemy==2.0.1",
    "apscheduler==3.10.4",

    "wrapt==1.16.0",
    "opentelemetry-api==1.26.0",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.26.0",
    "opentelemetry-exporter-otlp-proto-http==1.26.0",
]

[tool.setuptools]
packages=[
   "llmagpie.base",
   "llmagpie.core",
   "llmagpie.experimental",
]

[tool.setuptools.package-dir]
"llmagpie.base" = "base"
"llmagpie.core" =  "core"
"llmagpie.experimental" =  "experimental"
