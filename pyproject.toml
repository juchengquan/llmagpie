[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend="setuptools.build_meta"

[project]
name = "llmagpie"
version = "0.0.1"
requires-python = ">=3.10"
authors = [
    {name="blackmount8"}
]
classifiers = [
    "Protramming Language :: Python :: 3",
    "License :: OSI Approved :: MIT LIcense",
    "Operation System :: OS Independent",
]

dependencies = [
    "numpy",
    "networkx",
    "deprecated",
    "chromadb",
    "pydantic",
    "requests",
    "httpx",
    "pytz",
]

[project.optional-dependencies]
all = [
    "sqlalchemy==2.0.1",
    "apscheduler==3.10.4",

    "wrapt==1.16.0",
    "opentelemetry-api==1.26.0",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.26.0",
    "opentelemetry-exporter-otlp-proto-http==1.26.0",
]

[tool.setuptools]
packages = [
    "llmagpie",
    "llmagpie.base",
    "llmagpie.core",
    "llmagpie.experimental",
]

[tool.setuptools.package-dir]
"llmagpie" = "libs/llmagpie"
"llmagpie.base" = "libs/llmagpie/base"
"llmagpie.core" = "libs/llmagpie/core"
"llmagpie.experimental" = "libs/llmagpie/experimental"
