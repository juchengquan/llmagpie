[project]
name = "llmagpie"
version = "0.0.0"
description = "A lightweight Python framework for composing LLM pipelines from nodes and DAGs."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "blackmount8", email = "blackmount8@gmail.com" },
]
keywords = ["llm", "pipeline", "dag", "agent", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "networkx>=3.6,<4",
    "Deprecated>=1.2,<2",
    "pytz>=2025.1",
    "wrapt>=1.17.0",
    "pydantic>=2.8.0,<3",
    "httpx>=0.28.0,<0.29",
]

[project.optional-dependencies]
exp = [
    "sqlalchemy>=2.0.30,<3",
    "chromadb>=1.0.0,<2",
]
openai = [
    "openai>=1.50,<3.0",
]
opentelemetry = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/juchengquan/llmagpie"
Repository = "https://github.com/juchengquan/llmagpie"
Issues = "https://github.com/juchengquan/llmagpie/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/llmagpie"]

[tool.hatch.build.targets.sdist]
include = [
    "libs/llmagpie",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs"]
addopts = "-ra"
