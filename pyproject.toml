[tool.poetry]
name = "llmagpie"
version = "0.0.0"
description = "A lightweight Python framework for composing LLM pipelines from nodes and DAGs."
authors = ["blackmount8 <blackmount8@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/juchengquan/llmagpie"
repository = "https://github.com/juchengquan/llmagpie"
keywords = ["llm", "pipeline", "dag", "agent", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    {include="llmagpie", from="libs"}
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"
networkx = "^3.4.0"
Deprecated = "^1.0"
pytz = ">=2024.2"
wrapt = ">=1.17.0"
pydantic = "^2.8.0"
httpx = "^0.27.0"

sqlalchemy = { version = "^2.0.6", optional=true }
chromadb = {version = "^0.5.0", optional=true }
opentelemetry-api = { version = "^1.28.2", optional=true }
opentelemetry-sdk = { version = "^1.28.2", optional=true }
opentelemetry-exporter-otlp-proto-grpc = { version = "^1.28.2", optional=true }
opentelemetry-exporter-otlp-proto-http = { version = "^1.28.2", optional=true }

[tool.poetry.extras]
exp = ["sqlalchemy", "chromadb"]
opentelemetry = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-grpc", "opentelemetry-exporter-otlp-proto-http"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs"]
addopts = "-ra"
