name: Bug report
description: Something in llmagpie behaves differently than documented or expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Short description of the bug. What did you expect to happen,
        and what actually happened?
      placeholder: |
        I called `pipe.invoke(...)` with X and expected Y, but got Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        A self-contained snippet (ideally based on one of the
        `_examples/simple_composition/` files) that triggers the bug.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: llmagpie version / commit
      placeholder: "0.0.0 or <git sha>"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: pydantic
    attributes:
      label: pydantic version
      description: "Run `python -c 'import pydantic; print(pydantic.VERSION)'`"
      placeholder: "2.13.4"

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback (if any)
      render: shell
